{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <title>{% block title %}Корпоративные объявления{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'portal/style.css' %}">
    <script defer src="{% static 'portal/app.js' %}"></script>
</head>
<body>
    <header class="site-header">
        {% include "portal/partials/navigation.html" %}
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container">Корпоративный портал объявлений</div>
    </footer>
</body>
</html>
